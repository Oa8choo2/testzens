name: deploy documentation to github pages
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
  # see https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev        

      - run: uv pip install zensical
      - run: find /home/runner/work/ -name zensical -ls
      - run: /home/runner/work/testzens/testzens/.venv/bin/zensical --version
      # run zensical
      - run: /home/runner/work/testzens/testzens/.venv/bin/zensical build --clean

      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: site
      - uses: actions/deploy-pages@v5.0.0
        id: deployment
